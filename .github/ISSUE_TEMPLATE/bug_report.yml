name: Bug report
description: Something does not work as expected
body:
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Minecraft, Fabric Loader, Fabric API and mod version
      placeholder: "26.3 / 0.20.1 / 0.165.0+26.3 / 1.0.0"
    validations:
      required: true
  - type: input
    id: mods
    attributes:
      label: Other mods (for example Sodium and its version)
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log or crash report
      description: Paste the relevant part of logs/latest.log, or attach the crash report.
      render: text
